		11FF87AA301E9FE50049DBAB /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			shellPath = /bin/sh;
			shellScript = (
				"# Embed the dSYM in the app bundle so Kotlin/Native's libbacktrace source-info",
				"# backend (simulator workaround) finds it next to the executable:",
				"# <app>/KotlinTraceSample.dSYM/Contents/Resources/DWARF/KotlinTraceSample",
				"set -e",
				"if [ \"${CONFIGURATION}\" = \"Debug\" ]; then",
				"  DSYM_SRC=\"${DWARF_DSYM_FOLDER_PATH}/${PRODUCT_NAME}.app.dSYM\"",
				"  if [ ! -d \"${DSYM_SRC}\" ]; then",
				"    DSYM_SRC=\"${DWARF_DSYM_FOLDER_PATH}/${EXECUTABLE_NAME}.dSYM\"",
				"  fi",
				"  DSYM_DST=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/${EXECUTABLE_NAME}.dSYM\"",
				"  if [ -d \"${DSYM_SRC}\" ]; then",
				"    rm -rf \"${DSYM_DST}\"",
				"    cp -R \"${DSYM_SRC}\" \"${DSYM_DST}\"",
				"  else",
				"    echo \"warning: no dSYM found at ${DWARF_DSYM_FOLDER_PATH} to embed\"",
				"  fi",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

