		11FF87AA301E9FE50049DBAB /* ShellScript */ = {
			isa = PBXShellScriptBuildPhase;
			shellPath = /bin/sh;
			shellScript = (
				"# Embed the dSYM in the app bundle so Kotlin/Native's libbacktrace source-info",
				"# backend finds it next to the executable (simulators AND devices;",
				"# Xcode strips __debug_* from installed binaries):",
				"# <app>/KotlinTraceSample.dSYM/Contents/Resources/DWARF/KotlinTraceSample",
				"set -e",
				"DSYM_SRC=\"${DWARF_DSYM_FOLDER_PATH}/${PRODUCT_NAME}.app.dSYM\"",
				"if [ ! -d \"${DSYM_SRC}\" ]; then",
				"  DSYM_SRC=\"${DWARF_DSYM_FOLDER_PATH}/${EXECUTABLE_NAME}.dSYM\"",
				"fi",
				"DSYM_DST=\"${TARGET_BUILD_DIR}/${WRAPPER_NAME}/${EXECUTABLE_NAME}.dSYM\"",
				"if [ -d \"${DSYM_SRC}\" ]; then",
				"  rm -rf \"${DSYM_DST}\"",
				"  cp -R \"${DSYM_SRC}\" \"${DSYM_DST}\"",
				"else",
				"  echo \"warning: no dSYM found at ${DWARF_DSYM_FOLDER_PATH} to embed\"",
				"fi",
				"",
			);
		};
		6F093C6F08BE4BF7A1428305 /* Upload Debug Symbols to Sentry */ = {
			isa = PBXShellScriptBuildPhase;
			inputPaths = (
				"${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}",
			);
			name = "Upload Debug Symbols to Sentry";
			shellPath = /bin/sh;
			shellScript = (
				"# This script is responsible for uploading debug symbols and source context for Sentry.",
				"if [[ \"$(uname -m)\" == arm64 ]]; then",
				"  export PATH=\"/opt/homebrew/bin:$PATH\"",
				"fi",
				"",
				"if which sentry-cli >/dev/null; then",
				"  export SENTRY_ORG=na-q2i",
				"  export SENTRY_PROJECT=apple-ios",
				"  ERROR=$(sentry-cli debug-files upload --include-sources \"$DWARF_DSYM_FOLDER_PATH\" 2>&1 >/dev/null)",
				"  if [ ! $? -eq 0 ]; then",
				"    echo \"warning: sentry-cli - $ERROR\"",
				"  fi",
				"else",
				"  echo \"warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases\"",
				"fi",
				"",
			);
		};
/* End PBXShellScriptBuildPhase section */

